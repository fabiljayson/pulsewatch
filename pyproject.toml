[project]
name = "pulsewatch"
version = "0.1.0"
description = "PulseWatch — API Health & Reliability Observatory. Lightweight API monitoring built with FastAPI, SQLite, HTTPX, and Pytest."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "fabiljayson" }]
keywords = ["monitoring", "api", "health-check", "fastapi", "httpx", "sqlite"]
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "uvicorn>=0.30.0",
]

[project.urls]
Homepage = "https://github.com/fabiljayson/pulsewatch"
Repository = "https://github.com/fabiljayson/pulsewatch"
Issues = "https://github.com/fabiljayson/pulsewatch/issues"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["app"]
branch = false

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # comprehensions
    "RUF",  # ruff-specific
]
ignore = [
    "SIM108",  # ternary is not always clearer
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
